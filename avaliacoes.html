<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avaliações - Biscuit</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <img src="https://raw.githubusercontent.com/AbdallahJaajoul/Biscuit/main/293406571_464018015726261_7839916373839900193_n.jpg" alt="Logo Biscuit">
        <h1>Biscuit</h1>
      </div>

      <nav class="nav">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="sobrenos.html">Sobre Nós</a></li>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="bolos.html">Bolos</a></li>
          <li><a class="ativo" href="avaliacoes.html">Avaliações</a></li>
          <li><a href="horários.html">Horário</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2 class="section-title" style="text-align:center;">Deixa a tua avaliação</h2>

      <form id="form-avaliacao" style="display:grid; gap:14px; max-width:600px; margin:0 auto 30px;">
        <input type="text" id="nome" placeholder="O teu nome" required style="padding:12px; border:1px solid #ccc; border-radius:10px;">
        <textarea id="comentario" placeholder="Escreve o teu comentário" required rows="5" style="padding:12px; border:1px solid #ccc; border-radius:10px; resize:vertical;"></textarea>
        <select id="avaliacao" required style="padding:12px; border:1px solid #ccc; border-radius:10px;">
          <option value="">Escolhe a avaliação</option>
          <option value="1">1 estrela</option>
          <option value="2">2 estrelas</option>
          <option value="3">3 estrelas</option>
          <option value="4">4 estrelas</option>
          <option value="5">5 estrelas</option>
        </select>
        <button type="submit" style="padding:12px; border:none; border-radius:10px; background:#e29f81; color:white; font-weight:bold; cursor:pointer;">
          Enviar avaliação
        </button>
      </form>

      <h2 class="section-title" style="text-align:center;">Avaliações dos clientes</h2>
      <div id="lista-avaliacoes" style="display:grid; gap:16px; max-width:700px; margin:0 auto;"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Biscuit. Todos os direitos reservados.</p>
  </footer>

  <script type="module" src="firebase-avaliacoes.js"></script>
</body>
</html>
